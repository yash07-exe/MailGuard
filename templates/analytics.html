<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailGuard - Analytics Dashboard</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 40, 0.8);
            --bg-accent: #1e2d45;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-electric: #38bdf8;
            --accent-purple: #a78bfa;
            --border-color: #1e2d45;
            --risk-low: #22c55e;
            --risk-moderate: #f59e0b;
            --risk-high: #ef4444;
            --risk-critical: #dc2626;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        /* Page Header */
        .page-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .page-title {
            font-size: 2rem;
            font-weight: 600;
        }
        
        /* Card Style */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
        }
        
        /* Stat Card */
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            border-color: var(--accent-electric);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-electric), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        /* Chart Card */
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
        }
        
        .chart-title {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        
        /* Progress Stat */
        .progress-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        
        .progress-stat span {
            color: var(--text-secondary);
        }
        
        .progress-stat.high span { color: var(--risk-high); }
        .progress-stat.moderate span { color: var(--risk-moderate); }
        .progress-stat.low span { color: var(--risk-low); }
        
        /* Progress Bar */
        .progress-container {
            background: var(--bg-accent);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        
        .progress-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        .progress-bar.low { background: var(--risk-low); }
        .progress-bar.moderate { background: var(--risk-moderate); }
        .progress-bar.high { background: var(--risk-high); }
        .progress-bar.critical { background: var(--risk-critical); }
        
        /* Weekly Activity Chart Container */
        .weekly-chart {
            height: 200px;
        }
        
        /* Risk Distribution Chart */
        .risk-distribution {
            display: flex;
            justify-content: space-around;
            margin-top: 1rem;
        }
        
        .risk-distribution-item {
            text-align: center;
            min-width: 80px;
        }
        
        .risk-distribution-value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        
        .risk-distribution-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .risk-distribution {
                flex-direction: column;
                align-items: center;
            }
            
            .risk-distribution-item {
                margin-bottom: 1rem;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shield-alt me-2"></i> MailGuard
            </a>
        </div>
    </nav>
    
    <div class="container mt-5 pt-5">
        <div class="page-header">
            <h2 class="page-title"><i class="fas fa-chart-meh me-2"></i> Analytics Dashboard</h2>
            <p class="text-secondary small">Email phishing detection analytics and statistics</p>
        </div>
        
        <!-- Key Stats Row -->
        <div class="row gy-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="stat-number" id="dash-total">0</div>
                    <div class="stat-label">Total Scanned</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="stat-number" id="dash-phishing">0</div>
                    <div class="stat-label">Potential Phishing</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="stat-number" id="dash-low">0</div>
                    <div class="stat-label">Low Risk</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="stat-number" id="dash-high">0</div>
                    <div class="stat-label">High Risk</div>
                </div>
            </div>
        </div>
        
        <!-- Charts Row -->
        <div class="row gy-4">
            <!-- Weekly Activity Chart -->
            <div class="col-12 col-md-6">
                <div class="chart-card">
                    <div class="chart-title">Weekly Scanning Activity (Last 7 Days)</div>
                    <canvas id="weeklyChart" class="weekly-chart"></canvas>
                </div>
            </div>
            
            <!-- Risk Distribution Chart -->
            <div class="col-12 col-md-6">
                <div class="chart-card">
                    <div class="chart-title">Risk Distribution</div>
                    <div class="risk-distribution" id="riskDistribution">
                        <!-- Will be populated by JS -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Detailed Stats -->
        <div class="row gy-4 mt-4">
            <div class="col-12 col-md-6">
                <div class="card">
                    <h5 class="card-title small text-secondary mb-3">Phishing Detection Percentage</h5>
                    <div class="progress-container">
                        <div class="progress-bar low" id="progress-low" style="width: 0%">0%</div>
                    </div>
                    <span id="percentage-low" class="small text-secondary">Low Risk: 0%</span>
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div class="card">
                    <h5 class="card-title small text-secondary mb-3">Email Volume Trend</h5>
                    <div class="progress-container">
                        <div class="progress-bar moderate" id="progress-moderate" style="width: 0%">0%</div>
                    </div>
                    <span id="percentage-moderate" class="small text-secondary">Moderate Risk: 0%</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script>
        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', function() {
            loadAnalyticsData();
        });
        
        // Load analytics data
        async function loadAnalyticsData() {
            try {
                const response = await fetch('/api/analytics');
                const data = await response.json();
                
                if (data.success && data.analytics) {
                    const a = data.analytics;
                    updateAnalyticsUI(a);
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }
        
        // Update analytics UI
        function updateAnalyticsUI(analytics) {
            const { total_scanned, potential_phishing, low_risk, high_risk, phishing_percentage, 
                    weekly_activity, risk_distribution } = analytics;
            
            // Update key stats
            document.getElementById('dash-total').textContent = total_scanned || 0;
            document.getElementById('dash-phishing').textContent = potential_phishing || 0;
            document.getElementById('dash-low').textContent = low_risk || 0;
            document.getElementById('dash-high').textContent = high_risk || 0;
            
            // Update progress bars
            document.getElementById('progress-low').style.width = '20%';
            document.getElementById('progress-moderate').style.width = '30%';
            
            // Calculate percentages
            const lowPct = total_scanned > 0 ? Math.round((low_risk / total_scanned) * 100) : 0;
            const modPct = total_scanned > 0 ? Math.round(((total_scanned - high_risk - potential_phishing) / total_scanned) * 100) : 0;
            const highPct = total_scanned > 0 ? Math.round((high_risk / total_scanned) * 100) : 0;
            
            // Update percentage displays
            document.getElementById('percentage-low').textContent = `Low Risk: ${lowPct}%`;
            document.getElementById('percentage-moderate').textContent = `Moderate Risk: ${modPct}%`;
            
            // Update progress bars with correct widths
            document.querySelectorAll('.progress-bar').forEach(bar => {
                const label = bar.previousElementSibling?.textContent || '';
                if (label.includes('Low Risk')) {
                    bar.style.width = `${lowPct}%`;
                } else if (label.includes('Moderate Risk')) {
                    bar.style.width = `${modPct}%`;
                }
            });
            
            // Update risk distribution
            updateRiskDistribution(risk_distribution || []);
            
            // Update weekly chart
            updateWeeklyChart(weekly_activity || []);
        }
        
        // Update risk distribution UI
        function updateRiskDistribution(distribution) {
            const container = document.getElementById('riskDistribution');
            
            if (!distribution || distribution.length === 0) {
                container.innerHTML = '<p class="text-secondary small">No data available</p>';
                return;
            }
            
            const levelLabels = {
                'Low Risk': '#22c55e',
                'Moderate Risk': '#f59e0b',
                'High Risk': '#ef4444',
                'Critical Risk': '#dc2626'
            };
            
            let html = '';
            distribution.forEach(item => {
                const level = item.level || 'Low Risk';
                const count = item.count || 0;
                const color = levelLabels[level] || '#94a3b8';
                
                html += `
                    <div class="risk-distribution-item">
                        <div class="risk-distribution-value" style="color: ${color}">${count}</div>
                        <div class="risk-distribution-label" style="color: ${color}">${level}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // Update weekly chart
        function updateWeeklyChart(activityData) {
            const ctx = document.getElementById('weeklyChart').getContext('2d');
            const styles = getComputedStyle(document.documentElement);
            const accentColor = styles.getPropertyValue('--accent-electric').trim();
            const borderColor = styles.getPropertyValue('--border-color').trim();
            const textColor = styles.getPropertyValue('--text-secondary').trim();
            
            // Destroy existing chart if present
            if (window.weeklyChartInstance) {
                window.weeklyChartInstance.destroy();
            }
            
            // Prepare data
            const labels = [];
            const data = [];
            
            // Get last 7 days
            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(today.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                labels.push(dateStr);
                
                // Find matching day's count
                const dayData = activityData.find(a => a.date === dateStr);
                data.push(dayData ? dayData.count : 0);
            }
            
            if (labels.length === 0) {
                ctx.canvas.parentElement.innerHTML = '<p class="text-secondary small">No scanning activity yet</p>';
                return;
            }
            
            window.weeklyChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Emails Scanned',
                        data: data,
                        borderColor: accentColor,
                        backgroundColor: 'rgba(56, 175, 248, 0.1)',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false
                        }
                    },
                    scales: {
                        y: {
                            display: true,
                            grid: {
                                color: borderColor
                            },
                            ticks: {
                                color: textColor
                            }
                        },
                        x: {
                            grid: {
                                color: borderColor
                            },
                            ticks: {
                                color: textColor
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
